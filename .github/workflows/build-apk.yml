
name: Build Triangle Area APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TriangleAreaAndroidProject.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip TriangleAreaAndroidProject.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p TriangleAreaAndroid assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: TriangleArea-APK
          path: TriangleAreaAndroid/app/build/outputs/apk/debug/app-debug.apk
          
